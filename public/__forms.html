<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Netlify Form Detection</title></head>
<body>
  <!-- Hidden form so Netlify registers the "quote" form at build time. Do not delete. -->
  <form enctype="multipart/form-data" name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="quote" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="company" />
    <input type="text" name="service" />
    <input type="text" name="location" />
    <input type="text" name="timeline" />
    <input type="text" name="budget" />
    <input type="text" name="contact_method" />
    <input type="text" name="service_summary" />
    <textarea name="message"></textarea>
    <textarea name="description"></textarea>
    <input type="file" name="attachment_1" />
    <input type="file" name="attachment_2" />
    <input type="file" name="attachment_3" />
    <input type="file" name="attachment_4" />
    <input type="file" name="attachment_5" />
  </form>
</body>
</html>
